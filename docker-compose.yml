version: "3.9"

services:
  app:
    build: .
    image: docbot:latest
    container_name: docbot-app
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - PYTHONPATH=/workspace
    entrypoint: ["docbot"]
    command: ["status", "--config", "/workspace/config.toml"]

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: docbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
