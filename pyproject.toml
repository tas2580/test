[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docbot"
version = "0.1.0"
description = "Offline CLI-Dokumentenchat mit Ollama, Chroma und SQLite"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "chromadb>=0.5.5",
  "python-json-logger>=2.0.7",
  "rich>=13.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
docbot = "docbot.cli:app"

[tool.setuptools]
packages = ["docbot", "docbot.indexing", "docbot.chat"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "smoke: markiert Smoke-Tests mit lokalem Chroma/SQLite",
]
